[project]
name = "agents-guide"
version = "0.1.0"
description = "agents-guide skill helper CLI"
requires-python = ">=3.9"
dependencies = [
    "pathspec",
]

[project.scripts]
agents-guide = "agents_guide.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
